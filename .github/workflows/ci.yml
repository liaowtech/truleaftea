name: CI
on: [push]
jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Theme Check (Shopify CLI)
        run: |
          npm install --no-package-lock --no-save @shopify/cli
          npx shopify theme check --fail-level error
  lhci:
    name: Lighthouse
    runs-on: ubuntu-latest
    # Runs only when the store secrets are configured; this repo has none, so the job is skipped instead of failing.
    env:
      HAS_STORE_SECRETS: ${{ secrets.SHOP_STORE_OS2 != '' && secrets.SHOP_PASSWORD_OS2 != '' && secrets.SHOP_ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.HAS_STORE_SECRETS == 'true'
      - name: Lighthouse
        if: env.HAS_STORE_SECRETS == 'true'
        uses: shopify/lighthouse-ci-action@v1
        with:
          store: ${{ secrets.SHOP_STORE_OS2 }}
          password: ${{ secrets.SHOP_PASSWORD_OS2 }}
          access_token: ${{ secrets.SHOP_ACCESS_TOKEN }}
          collection_handle: all
          lhci_github_app_token: ${{ secrets.LHCI_GITHUB_TOKEN }}
          pull_theme: ${{ secrets.SHOP_PULL_THEME }}
      - name: Skipped
        if: env.HAS_STORE_SECRETS != 'true'
        run: echo "Lighthouse skipped - store secrets not configured"
